<div class="tm-site" data-page="AdminTeam" id="tm-site-root">
<header class="tm-top">
    <button type="button" class="tm-burger" aria-label="Menu" onclick="AdminTeamJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="tm-logo" href="Admin"><img src="images/logo.svg" alt="" width="30" height="30"><span id="tm-brand">Staff</span><small>Staff</small></a>
    <div class="tm-who" id="tm-who"></div>
    <a class="tm-tl tm-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="tm-tl" onclick="AdminTeamJs.signout()">Sign out</button>
</header>
<div class="tm-body">
    <nav class="tm-rail" id="tm-rail" aria-label="Staff menu">
        <div class="tm-rail-top"><b>Menu</b><button type="button" class="tm-ibtn" aria-label="Close menu" onclick="AdminTeamJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="tm-menu" id="tm-menu"></div>
    </nav>
    <div class="tm-scrim" id="tm-scrim" onclick="AdminTeamJs.closeMenu()"></div>
    <main class="tm-main" id="tm-main"><div class="tm-loading">Loading</div></main>
</div>
<div class="tm-modal" id="tm-modal" aria-hidden="true">
    <div class="tm-mbox" role="dialog" aria-modal="true" aria-labelledby="tm-mtitle">
        <div class="tm-mhead"><h2 id="tm-mtitle"></h2><button type="button" class="tm-ibtn" aria-label="Close" onclick="AdminTeamJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="tm-mbody" id="tm-mbody"></div>
    </div>
</div>
<div class="tm-pk" id="tm-pk" aria-hidden="true">
    <div class="tm-pkbox" role="dialog" aria-modal="true" aria-labelledby="tm-pkt">
        <div class="tm-mhead"><h2 id="tm-pkt">Choose from the media library</h2><button type="button" class="tm-ibtn" aria-label="Close" onclick="AdminTeamJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="tm-mbody">
            <p class="tm-hint" id="tm-pkhint"></p>
            <div class="tm-pkbar"><input type="search" id="tm-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminTeamJs.pkSearch()" aria-label="Search media"><label class="tm-btn tm-btn-ghost tm-btn-sm tm-upbtn">Upload new<input type="file" id="tm-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminTeamJs.pkUpload()"></label></div>
            <p class="tm-upmsg" id="tm-pkmsg" role="status"></p>
            <div class="tm-pkgrid" id="tm-pkgrid"></div>
            <div class="tm-pkfoot"><button type="button" class="tm-btn tm-btn-ghost" onclick="AdminTeamJs.pkClose()">Cancel</button><button type="button" class="tm-btn" id="tm-pkuse" onclick="AdminTeamJs.pkUse()" hidden>Use these</button></div>
        </div>
    </div>
</div>
<div class="tm-toast" id="tm-toast" role="status" aria-live="polite"></div>
</div>
