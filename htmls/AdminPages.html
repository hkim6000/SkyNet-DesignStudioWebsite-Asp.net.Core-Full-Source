<div class="pg-site" data-page="AdminPages" id="pg-site-root">
<header class="pg-top">
    <button type="button" class="pg-burger" aria-label="Menu" onclick="AdminPagesJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="pg-logo" href="Admin"><img src="images/logo.svg" alt="" width="30" height="30"><span id="pg-brand">Staff</span><small>Staff</small></a>
    <div class="pg-who" id="pg-who"></div>
    <a class="pg-tl pg-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="pg-tl" onclick="AdminPagesJs.signout()">Sign out</button>
</header>
<div class="pg-body">
    <nav class="pg-rail" id="pg-rail" aria-label="Staff menu">
        <div class="pg-rail-top"><b>Menu</b><button type="button" class="pg-ibtn" aria-label="Close menu" onclick="AdminPagesJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pg-menu" id="pg-menu"></div>
    </nav>
    <div class="pg-scrim" id="pg-scrim" onclick="AdminPagesJs.closeMenu()"></div>
    <main class="pg-main" id="pg-main"><div class="pg-loading">Loading</div></main>
</div>
<div class="pg-modal" id="pg-modal" aria-hidden="true">
    <div class="pg-mbox" role="dialog" aria-modal="true" aria-labelledby="pg-mtitle">
        <div class="pg-mhead"><h2 id="pg-mtitle"></h2><button type="button" class="pg-ibtn" aria-label="Close" onclick="AdminPagesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pg-mbody" id="pg-mbody"></div>
    </div>
</div>
<div class="pg-pk" id="pg-pk" aria-hidden="true">
    <div class="pg-pkbox" role="dialog" aria-modal="true" aria-labelledby="pg-pkt">
        <div class="pg-mhead"><h2 id="pg-pkt">Choose from the media library</h2><button type="button" class="pg-ibtn" aria-label="Close" onclick="AdminPagesJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pg-mbody">
            <p class="pg-hint" id="pg-pkhint"></p>
            <div class="pg-pkbar"><input type="search" id="pg-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminPagesJs.pkSearch()" aria-label="Search media"><label class="pg-btn pg-btn-ghost pg-btn-sm pg-upbtn">Upload new<input type="file" id="pg-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminPagesJs.pkUpload()"></label></div>
            <p class="pg-upmsg" id="pg-pkmsg" role="status"></p>
            <div class="pg-pkgrid" id="pg-pkgrid"></div>
            <div class="pg-pkfoot"><button type="button" class="pg-btn pg-btn-ghost" onclick="AdminPagesJs.pkClose()">Cancel</button><button type="button" class="pg-btn" id="pg-pkuse" onclick="AdminPagesJs.pkUse()" hidden>Use these</button></div>
        </div>
    </div>
</div>
<div class="pg-toast" id="pg-toast" role="status" aria-live="polite"></div>
</div>
