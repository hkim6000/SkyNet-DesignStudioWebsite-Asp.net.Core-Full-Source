<div class="jr-site" data-page="AdminJournal" id="jr-site-root">
<header class="jr-top">
    <button type="button" class="jr-burger" aria-label="Menu" onclick="AdminJournalJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="jr-logo" href="Admin"><img src="images/logo.svg" alt="" width="30" height="30"><span id="jr-brand">Staff</span><small>Staff</small></a>
    <div class="jr-who" id="jr-who"></div>
    <a class="jr-tl jr-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="jr-tl" onclick="AdminJournalJs.signout()">Sign out</button>
</header>
<div class="jr-body">
    <nav class="jr-rail" id="jr-rail" aria-label="Staff menu">
        <div class="jr-rail-top"><b>Menu</b><button type="button" class="jr-ibtn" aria-label="Close menu" onclick="AdminJournalJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="jr-menu" id="jr-menu"></div>
    </nav>
    <div class="jr-scrim" id="jr-scrim" onclick="AdminJournalJs.closeMenu()"></div>
    <main class="jr-main" id="jr-main"><div class="jr-loading">Loading</div></main>
</div>
<div class="jr-modal" id="jr-modal" aria-hidden="true">
    <div class="jr-mbox" role="dialog" aria-modal="true" aria-labelledby="jr-mtitle">
        <div class="jr-mhead"><h2 id="jr-mtitle"></h2><button type="button" class="jr-ibtn" aria-label="Close" onclick="AdminJournalJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="jr-mbody" id="jr-mbody"></div>
    </div>
</div>
<div class="jr-pk" id="jr-pk" aria-hidden="true">
    <div class="jr-pkbox" role="dialog" aria-modal="true" aria-labelledby="jr-pkt">
        <div class="jr-mhead"><h2 id="jr-pkt">Choose from the media library</h2><button type="button" class="jr-ibtn" aria-label="Close" onclick="AdminJournalJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="jr-mbody">
            <p class="jr-hint" id="jr-pkhint"></p>
            <div class="jr-pkbar"><input type="search" id="jr-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminJournalJs.pkSearch()" aria-label="Search media"><label class="jr-btn jr-btn-ghost jr-btn-sm jr-upbtn">Upload new<input type="file" id="jr-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminJournalJs.pkUpload()"></label></div>
            <p class="jr-upmsg" id="jr-pkmsg" role="status"></p>
            <div class="jr-pkgrid" id="jr-pkgrid"></div>
            <div class="jr-pkfoot"><button type="button" class="jr-btn jr-btn-ghost" onclick="AdminJournalJs.pkClose()">Cancel</button><button type="button" class="jr-btn" id="jr-pkuse" onclick="AdminJournalJs.pkUse()" hidden>Use these</button></div>
        </div>
    </div>
</div>
<div class="jr-toast" id="jr-toast" role="status" aria-live="polite"></div>
</div>
