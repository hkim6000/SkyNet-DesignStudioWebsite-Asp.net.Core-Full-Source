<div class="ak-site" data-page="AdminAccount" id="ak-site-root">
<header class="ak-top">
    <button type="button" class="ak-burger" aria-label="Menu" onclick="AdminAccountJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ak-logo" href="Admin"><img src="images/logo.svg" alt="" width="30" height="30"><span id="ak-brand">Staff</span><small>Staff</small></a>
    <div class="ak-who" id="ak-who"></div>
    <a class="ak-tl ak-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ak-tl" onclick="AdminAccountJs.signout()">Sign out</button>

<div class="ak-body">

<div class="ak-modal" id="ak-modal" aria-hidden="true">

        <div class="ak-mbody" id="ak-mbody"></div>
