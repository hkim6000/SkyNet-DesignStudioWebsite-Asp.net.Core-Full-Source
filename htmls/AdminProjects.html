<div class="pr-site" data-page="AdminProjects" id="pr-site-root">
<header class="pr-top">
    <button type="button" class="pr-burger" aria-label="Menu" onclick="AdminProjectsJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="pr-logo" href="Admin"><img src="images/logo.svg" alt="" width="30" height="30"><span id="pr-brand">Staff</span><small>Staff</small></a>
    <div class="pr-who" id="pr-who"></div>
    <a class="pr-tl pr-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="pr-tl" onclick="AdminProjectsJs.signout()">Sign out</button>
</header>
<div class="pr-body">
    <nav class="pr-rail" id="pr-rail" aria-label="Staff menu">
        <div class="pr-rail-top"><b>Menu</b><button type="button" class="pr-ibtn" aria-label="Close menu" onclick="AdminProjectsJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pr-menu" id="pr-menu"></div>
    </nav>
    <div class="pr-scrim" id="pr-scrim" onclick="AdminProjectsJs.closeMenu()"></div>
    <main class="pr-main" id="pr-main"><div class="pr-loading">Loading</div></main>
</div>
<div class="pr-modal" id="pr-modal" aria-hidden="true">
    <div class="pr-mbox" role="dialog" aria-modal="true" aria-labelledby="pr-mtitle">
        <div class="pr-mhead"><h2 id="pr-mtitle"></h2><button type="button" class="pr-ibtn" aria-label="Close" onclick="AdminProjectsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pr-mbody" id="pr-mbody"></div>
    </div>
</div>
<div class="pr-pk" id="pr-pk" aria-hidden="true">
    <div class="pr-pkbox" role="dialog" aria-modal="true" aria-labelledby="pr-pkt">
        <div class="pr-mhead"><h2 id="pr-pkt">Choose from the media library</h2><button type="button" class="pr-ibtn" aria-label="Close" onclick="AdminProjectsJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pr-mbody">
            <p class="pr-hint" id="pr-pkhint"></p>
            <div class="pr-pkbar"><input type="search" id="pr-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminProjectsJs.pkSearch()" aria-label="Search media"><label class="pr-btn pr-btn-ghost pr-btn-sm pr-upbtn">Upload new<input type="file" id="pr-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminProjectsJs.pkUpload()"></label></div>
            <p class="pr-upmsg" id="pr-pkmsg" role="status"></p>
            <div class="pr-pkgrid" id="pr-pkgrid"></div>
            <div class="pr-pkfoot"><button type="button" class="pr-btn pr-btn-ghost" onclick="AdminProjectsJs.pkClose()">Cancel</button><button type="button" class="pr-btn" id="pr-pkuse" onclick="AdminProjectsJs.pkUse()" hidden>Use these</button></div>
        </div>
    </div>
</div>
<div class="pr-toast" id="pr-toast" role="status" aria-live="polite"></div>
</div>
