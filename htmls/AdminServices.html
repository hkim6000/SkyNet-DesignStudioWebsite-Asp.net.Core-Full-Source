<div class="sa-site" data-page="AdminServices" id="sa-site-root">
<header class="sa-top">
    <button type="button" class="sa-burger" aria-label="Menu" onclick="AdminServicesJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="sa-logo" href="Admin"><img src="images/logo.svg" alt="" width="30" height="30"><span id="sa-brand">Staff</span><small>Staff</small></a>
    <div class="sa-who" id="sa-who"></div>
    <a class="sa-tl sa-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="sa-tl" onclick="AdminServicesJs.signout()">Sign out</button>
</header>
<div class="sa-body">
    <nav class="sa-rail" id="sa-rail" aria-label="Staff menu">
        <div class="sa-rail-top"><b>Menu</b><button type="button" class="sa-ibtn" aria-label="Close menu" onclick="AdminServicesJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="sa-menu" id="sa-menu"></div>
    </nav>
    <div class="sa-scrim" id="sa-scrim" onclick="AdminServicesJs.closeMenu()"></div>
    <main class="sa-main" id="sa-main"><div class="sa-loading">Loading</div></main>
</div>
<div class="sa-modal" id="sa-modal" aria-hidden="true">
    <div class="sa-mbox" role="dialog" aria-modal="true" aria-labelledby="sa-mtitle">
        <div class="sa-mhead"><h2 id="sa-mtitle"></h2><button type="button" class="sa-ibtn" aria-label="Close" onclick="AdminServicesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="sa-mbody" id="sa-mbody"></div>
    </div>
</div>
<div class="sa-pk" id="sa-pk" aria-hidden="true">
    <div class="sa-pkbox" role="dialog" aria-modal="true" aria-labelledby="sa-pkt">
        <div class="sa-mhead"><h2 id="sa-pkt">Choose from the media library</h2><button type="button" class="sa-ibtn" aria-label="Close" onclick="AdminServicesJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="sa-mbody">
            <p class="sa-hint" id="sa-pkhint"></p>
            <div class="sa-pkbar"><input type="search" id="sa-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminServicesJs.pkSearch()" aria-label="Search media"><label class="sa-btn sa-btn-ghost sa-btn-sm sa-upbtn">Upload new<input type="file" id="sa-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminServicesJs.pkUpload()"></label></div>
            <p class="sa-upmsg" id="sa-pkmsg" role="status"></p>
            <div class="sa-pkgrid" id="sa-pkgrid"></div>
            <div class="sa-pkfoot"><button type="button" class="sa-btn sa-btn-ghost" onclick="AdminServicesJs.pkClose()">Cancel</button><button type="button" class="sa-btn" id="sa-pkuse" onclick="AdminServicesJs.pkUse()" hidden>Use these</button></div>
        </div>
    </div>
</div>
<div class="sa-toast" id="sa-toast" role="status" aria-live="polite"></div>
</div>
